<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEKASIMARATHON 2026 Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#4b4b4b,#6b625c,#8b7d73);
color:#fff;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

/* HEADER */
.hero{
background:linear-gradient(135deg,#5c5048,#7a6d63,#9a8d83);
border-radius:24px;
padding:60px 20px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,.45);
margin-bottom:25px;
position:relative;
overflow:hidden;
}

.hero:before{
content:'';
position:absolute;
width:250px;
height:250px;
background:rgba(255,255,255,.08);
border-radius:50%;
top:-80px;
left:-80px;
}

.hero:after{
content:'';
position:absolute;
width:220px;
height:220px;
background:rgba(255,255,255,.06);
border-radius:50%;
bottom:-80px;
right:-80px;
}

.logo{
position:relative;
z-index:2;
font-size:58px;
font-weight:800;
letter-spacing:3px;
text-shadow:0 6px 18px rgba(0,0,0,.35);
}

.tagline{
position:relative;
z-index:2;
font-size:18px;
margin-top:10px;
font-weight:500;
opacity:.95;
}

.sub{
position:relative;
z-index:2;
margin-top:14px;
font-size:15px;
opacity:.9;
}

/* CARD */
.card{
background:rgba(40,40,40,.95);
border:1px solid rgba(255,255,255,.06);
border-radius:22px;
padding:25px;
margin-bottom:22px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.card h2{
font-size:24px;
margin-bottom:18px;
padding-bottom:12px;
border-bottom:1px solid rgba(255,255,255,.08);
}

.grid-2{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

.form-group{
margin-bottom:16px;
}

label{
display:block;
font-size:14px;
margin-bottom:7px;
color:#f1f1f1;
}

input,select{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#2e2e2e;
color:#fff;
font-size:14px;
outline:none;
}

input:focus,select:focus{
box-shadow:0 0 0 2px #b89b84;
}

/* TICKET */
.ticket-wrap{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

.ticket{
background:#2e2e2e;
padding:18px;
border-radius:18px;
cursor:pointer;
border:2px solid transparent;
transition:.25s;
}

.ticket:hover{
transform:translateY(-5px);
}

.ticket.active{
border-color:#d2b49c;
background:linear-gradient(135deg,#5c5048,#403833);
}

.ticket b{
font-size:18px;
display:block;
margin-bottom:8px;
}

.price{
font-size:15px;
font-weight:700;
color:#ffd59e;
}

.preview{
text-align:center;
}

.preview img{
max-width:100%;
border-radius:16px;
}

.invoice{
background:#1e1e1e;
padding:18px;
border-radius:16px;
line-height:1.9;
font-size:15px;
}

.qris{
text-align:center;
}

.qris img{
width:260px;
max-width:100%;
background:#fff;
padding:12px;
border-radius:18px;
}

.timer{
text-align:center;
font-size:26px;
font-weight:800;
color:#ffd59e;
margin-top:15px;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:16px;
font-size:20px;
font-weight:800;
cursor:pointer;
color:#fff;
background:linear-gradient(135deg,#6b625c,#a08f83);
box-shadow:0 10px 25px rgba(0,0,0,.35);
transition:.25s;
}

button:hover{
transform:translateY(-3px);
}

.note{
text-align:center;
margin-top:12px;
font-size:13px;
color:#ddd;
}

.footer{
text-align:center;
padding:35px 10px;
font-size:13px;
color:#ddd;
}

@media(max-width:800px){
.grid-2,.ticket-wrap{
grid-template-columns:1fr;
}
.logo{
font-size:38px;
}
.hero{
padding:45px 15px;
}
}
</style>
</head>

<body>

<div class="container">

<div class="hero">
<div class="logo">BEKASIMARATHON</div>
<div class="tagline">BEKASIMARATHON 2026</div>
<div class="sub">Official Registration System</div>
</div>

<form id="form">

<div class="card">
<h2>Pilih Kategori Tiket</h2>

<div class="ticket-wrap">

<div class="ticket" onclick="pick('5K',300000,this)">
<b>5K</b>
<div class="price">Rp300.000</div>
</div>

<div class="ticket" onclick="pick('10K',350000,this)">
<b>10K</b>
<div class="price">Rp350.000</div>
</div>

<div class="ticket" onclick="pick('Half Marathon',550000,this)">
<b>HM</b>
<div class="price">Rp550.000</div>
</div>

<div class="ticket" onclick="pick('Full Marathon',750000,this)">
<b>FM</b>
<div class="price">Rp750.000</div>
</div>

</div>
</div>

<div class="card">
<h2>Invoice</h2>
<div class="invoice" id="invoice">
Belum ada tiket dipilih
</div>
</div>

<button type="submit">DAFTAR SEKARANG</button>

</form>

<div class="footer">
© BEKASIMARATHON 2026 Official Registration System
</div>

</div>

<script>
let tiket='';
let harga=0;

function pick(n,p,e){
tiket=n;
harga=p;

document.querySelectorAll('.ticket').forEach(x=>{
x.classList.remove('active');
});

e.classList.add('active');

document.getElementById('invoice').innerHTML=
`
<b>Invoice Pendaftaran</b><br><br>
Kategori : ${n}<br>
Harga : Rp ${p.toLocaleString('id-ID')}<br>
Biaya Admin : Rp 5.000<br>
<b>Total : Rp ${(p+5000).toLocaleString('id-ID')}</b>
`;
}

document.getElementById('form').addEventListener('submit',function(a){
a.preventDefault();

if(tiket==''){
alert('Silakan pilih tiket terlebih dahulu');
return;
}

alert('Pendaftaran berhasil!');
});
</script>

</body>
</html>
